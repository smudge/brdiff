[package]
name = "brdiff"
version = "0.2.0"
authors = ["smudge <nathan@ngriffith.com>"]
edition = "2018"
categories = ["command-line-utilities", "multimedia::images"]
description = "A command-line tool for subtracting images to generate a new blue-red difference image."
repository = "https://github.com/smudge/brdiff"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
image = "0.23"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
